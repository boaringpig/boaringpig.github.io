<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TPF - Pig Management Tool</title>
		<!-- Tailwind CSS CDN for utility classes -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Shared design tokens (both classic and beta read these) -->
		<link rel="stylesheet" href="styles/theme.css" />
		<!-- Custom Stylesheet -->
		<link rel="stylesheet" href="styles/green.css" />
		<!-- Flatpickr CSS -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
		/>
		<!-- Custom Flatpickr Theme -->
		<link rel="stylesheet" href="styles/flatpickr-theme.css" />
		<!-- FullCalendar CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/main.min.css"
			rel="stylesheet"
		/>
		<script type="module" src="js/core/config.js"></script>
		<script type="module" src="js/theming/apply-theme.js"></script>
	</head>
	<body>
		<div class="container">
			<!-- Login Screen -->
			<div id="loginScreen" class="login-container">
				<div class="login-form">
					<button
						type="button"
						id="loginThemeToggleBtn"
						class="theme-toggle-btn"
						onclick="window.toggleThemeMode()"
					></button>
					<h1 class="login-title">Pig Management Tool Login</h1>

					<div
						id="errorMessage"
						class="error-message"
						style="display: none"
					></div>
					<div
						id="successMessage"
						class="success-message"
						style="display: none"
					></div>

					<form id="loginForm">
						<div class="form-group">
							<label class="form-label" for="username"
								>Username</label
							>
							<input
								type="text"
								id="username"
								class="form-input"
								required
							/>
						</div>

						<div class="form-group">
							<label class="form-label" for="password"
								>Password</label
							>
							<input
								type="password"
								id="password"
								class="form-input"
								required
							/>
						</div>

						<div class="form-group">
							<label class="form-label">
								<input type="checkbox" id="rememberMe" />
								Remember Me
							</label>
						</div>

						<button type="submit" class="login-btn">Login</button>
					</form>
				</div>
			</div>

			<!-- Invite Signup Screen (shown instead of the login screen when the
			     page is opened with a ?invite=<code> link) -->
			<div id="inviteSignupScreen" class="login-container" style="display: none">
				<div class="login-form">
					<h1 class="login-title">Join <span id="inviteGroupLabel"></span></h1>

					<div
						id="inviteErrorMessage"
						class="error-message"
						style="display: none"
					></div>

					<form id="inviteSignupForm">
						<div class="form-group">
							<label class="form-label" for="inviteUsername">Username</label>
							<input
								type="text"
								id="inviteUsername"
								class="form-input"
								placeholder="Username (lowercase, min 3 chars)"
								maxlength="30"
								required
							/>
						</div>

						<div class="form-group">
							<label class="form-label" for="invitePassword">Password</label>
							<input
								type="password"
								id="invitePassword"
								class="form-input"
								placeholder="Password (min 4 chars)"
								required
							/>
						</div>

						<div class="form-group">
							<label class="form-label" for="inviteDisplayName"
								>Display Name (optional)</label
							>
							<input
								type="text"
								id="inviteDisplayName"
								class="form-input"
								maxlength="30"
							/>
						</div>

						<button type="submit" class="login-btn">Join</button>
					</form>
				</div>
			</div>

		</div>

		<!-- Supabase Script -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

		<!-- Flatpickr Script -->
		<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

		<!-- FullCalendar Scripts - Updated approach -->
		<!-- 1. First load RRule library -->
		<script src="https://cdn.jsdelivr.net/npm/rrule@2.7.2/dist/es5/rrule.min.js"></script>

		<!-- 2. Load FullCalendar with all plugins in one bundle -->
		<script src="https://unpkg.com/@fullcalendar/core@6.1.18/index.global.min.js"></script>
		<script src="https://unpkg.com/@fullcalendar/daygrid@6.1.18/index.global.min.js"></script>
		<script src="https://unpkg.com/@fullcalendar/timegrid@6.1.18/index.global.min.js"></script>
		<script src="https://unpkg.com/@fullcalendar/list@6.1.18/index.global.min.js"></script>
		<script src="https://unpkg.com/@fullcalendar/rrule@6.1.18/index.global.min.js"></script>

		<!-- React beta dashboard mount point -- the only UI once logged in. -->
		<div id="betaRoot" style="display: none"></div>

		<!-- Consolidated Scripts -->
		<!-- Load helper and modal functions first, so all other files can access them -->
		<script type="module" src="js/core/ui-helpers.js"></script>
		<script type="module" src="js/core/ui-modals.js"></script>
		<!-- Then load core application logic -->
		<script type="module" src="js/admin/database-pigs.js"></script>
		<script type="module" src="js/admin/database-admin.js"></script>
		<script type="module" src="js/theming/contrast.js"></script>
		<script type="module" src="js/theming/terminology.js"></script>
		<script type="module" src="js/beta-bridge/beta-toggle.js"></script>
		<script type="module" src="js/core/main.js"></script>
		<script type="module" src="js/core/auth.js"></script>
		<script type="module" src="js/invites/invites.js"></script>
		<script type="module" src="js/core/database.js"></script>
		<!-- Database modules -->
		<script type="module" src="js/tasks/database-tasks.js"></script>
		<script type="module" src="js/suggestions/database-suggestions.js"></script>
		<script type="module" src="js/rewards/database-rewards.js"></script>
		<script type="module" src="js/user/database-user.js"></script>
		<script type="module" src="js/cost-trackers/database-cost-trackers.js"></script>
		<script type="module" src="js/chat/database-chat.js"></script>
		<script type="module" src="js/invites/database-invites.js"></script>
		<script type="module" src="js/motd/database-motd.js"></script>
		<script type="module" src="js/spiral/database-spirals.js"></script>
		<!-- UI rendering modules -->
		<script type="module" src="js/core/ui.js"></script>
		<script type="module" src="js/tasks/ui-tasks.js"></script>
		<script type="module" src="js/suggestions/ui-suggestions.js"></script>
		<script type="module" src="js/calendar/ui-calendar.js"></script>
		<script type="module" src="js/dashboard/ui-dashboard.js"></script>
		<script type="module" src="js/rewards/ui-rewards.js"></script>
		<script type="module" src="js/admin/ui-admin.js"></script>
		<script type="module" src="js/cost-trackers/ui-cost-trackers.js"></script>
		<script type="module" src="js/chat/ui-chat.js"></script>
		<script type="module" src="js/invites/ui-invites.js"></script>
		<script type="module" src="js/motd/ui-motd.js"></script>
		<!-- New file for tool initialization -->
		<script type="module" src="js/beta-bridge/tool-init.js"></script>
	</body>
</html>
